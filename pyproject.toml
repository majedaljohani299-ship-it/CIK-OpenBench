[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cik-openbench"
version = "0.1.2"
description = "Offline blinded pair evaluation for research hypotheses; no model-efficacy claims"
authors = [{name = "ماجد الجهني"}]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["evaluation", "benchmark", "blinding", "reproducibility"]

[tool.setuptools.packages.find]
include = ["cik_openbench*"]
